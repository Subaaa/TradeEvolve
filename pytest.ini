# pytest configuration
[pytest]
minversion = 8.0
testpaths = test
addopts = -ra -q --strict-markers
markers =
    unit: pure unit tests (no network, no DB)
    integration: tests that touch real or mocked Supabase + MCP subprocess
    replay: tests that exercise the full weekly loop on recorded fixtures
    soak: 24h stability tests (run manually)
filterwarnings =
    error
    ignore::DeprecationWarning:oandapyV20.*
    ignore::DeprecationWarning:mcp.*
    ignore::pydantic.warnings.PydanticDeprecatedSince211
    ignore::DeprecationWarning:dateutil.*
    ignore::PendingDeprecationWarning
    ignore::FutureWarning:pandas.*
