[project]
name = "TradeEvolve"
version = "0.1.0"
description = "Self-improving paper-trading research agent for XAU/USD on OANDA v20 fxTrade Practice."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Mavis" }]

dependencies = [
    # LLM
    "openai>=1.50.0",
    # OANDA
    "oandapyV20>=0.7.2",
    # MCP server / client (official)
    "mcp>=1.0.0",
    # Data + math
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    # Validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # DB
    "supabase>=2.8.0",
    "psycopg[binary]>=3.2.0",
    "sqlalchemy>=2.0.0",
    # Scheduling
    "apscheduler>=3.10.0",
    # API
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    # HTTP
    "httpx>=0.27.0",
    "feedparser>=6.0.0",
    # Prompts
    "jinja2>=3.1.0",
    # Logging
    "structlog>=24.0.0",
    # Misc
    "python-dateutil>=2.9.0",
    "pytz>=2024.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "respx>=0.21.0",
    "freezegun>=1.5.0",
    "mcp[cli]>=1.0.0",
]

[project.scripts]
tradeevolve = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "B", "UP",
    "SIM", "PL", "RUF", "PIE", "TID",
]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"test/**/*.py" = ["PLR2004", "S101"]
"app/llm/prompts/*.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
disallow_untyped_decorators = false
warn_unused_ignores = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["test"]
addopts = "-ra -q --strict-markers"
markers = [
    "unit: pure unit tests (no network, no DB)",
    "integration: tests that touch real or mocked Supabase + MCP subprocess",
    "replay: tests that exercise the full weekly loop on recorded fixtures",
    "soak: 24h stability tests (run manually)",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:oandapyV20.*",
]
