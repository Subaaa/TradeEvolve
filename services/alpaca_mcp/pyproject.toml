[project]
name = "alpaca-mcp"
version = "0.1.0"
description = "Alpaca (paper trading) MCP server for TradeEvolve."
requires-python = ">=3.11,<3.13"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alpaca_mcp"]
