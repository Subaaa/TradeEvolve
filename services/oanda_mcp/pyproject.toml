[project]
name = "oanda-mcp"
version = "0.1.0"
description = "OANDA v20 MCP server for TradeEvolve."
requires-python = ">=3.11,<3.13"
dependencies = [
    "mcp>=1.0.0",
    "oandapyV20>=0.7.2",
    "pydantic>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oanda_mcp"]
