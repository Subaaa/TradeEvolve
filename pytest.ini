# pytest configuration
[pytest]
minversion = 8.0
testpaths = test
addopts = -ra -q --strict-markers
markers =
    unit: pure unit tests (no network, no live DB)
    integration: tests that touch a real Alpaca paper account
    slow: long-running tests (run manually)
filterwarnings =
    error
    ignore::DeprecationWarning:dateutil.*
    ignore::PendingDeprecationWarning
    ignore::FutureWarning:pandas.*
